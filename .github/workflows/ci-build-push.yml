name: Build & Push Images to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Backend
      - name: Build backend image
        run: |
          docker build -t ghcr.io/aka056/projet-devops/backend:latest ./backend

      - name: Push backend image
        run: |
          docker push ghcr.io/aka056/projet-devops/backend:latest

      # Frontend
      - name: Build frontend image
        run: |
          docker build -t ghcr.io/aka056/projet-devops/frontend:latest ./frontend

      - name: Push frontend image
        run: |
          docker push ghcr.io/aka056/projet-devops/frontend:latest
