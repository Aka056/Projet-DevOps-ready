name: CI/CD-Pipeline

# Déclenche le workflow sur les push et pull requests vers la branche main

on: # "on" spécifie les événements qui déclenchent le workflow
  push: # "push" déclenche le workflow lorsqu'il y a un push vers la branche spécifiée
    branches:
      - main # Branche principale
  pull_request:
    branches:
      - main
  workflow_dispatch: # permet de lancer manuellement le workflow depuis GitHub

jobs: # "jobs" définit les tâches à exécuter dans le workflow
  super-lint: # Nom du job
    runs-on: ubuntu-latest # Spécifie l'environnement d'exécution

    steps: # "steps" définit les étapes à exécuter
    # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1️ Vérifier la syntaxe
      - name: Run Super-Linter #super-linter verifie la syntaxe du code
        uses: github/super-linter@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          #VALIDATE_ALL_CODEBASE: true
          #VALIDATE_PYTHON_BLACK: true
          #VALIDATE_JAVASCRIPT_ES: true
          #VALIDATE_CSS: true
          VALIDATE_ALL_CODEBASE: False
          VALIDATE_PYTHON_BLACK: False
          VALIDATE_JAVASCRIPT_ES: False
          VALIDATE_CSS: False
          
  build-and-test: # Nom du job
    needs: super-lint # Ce job dépend du job "super-lint" évite de se lancer parallèlement avec lui
    runs-on: ubuntu-latest # Spécifie l'environnement d'exécution
    # evite de se lancer si l'acteur est github-actions ce qui evite les boucles infinies avec l'auto-fix.ym 
    if: github.actor != 'github-actions' 

    services: # "services" définit les services nécessaires pour le job
      postgres: # Nom du service
        image: postgres:15 # Image Docker à utiliser
        env: # Variables d'environnement pour le service
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: 264352
          POSTGRES_DB: mydb
        ports:
          - 5433:5432 # Redirige le port 5432 du conteneur vers le port 5433 de l'hôte pour éviter les conflits locaux cela nous Évite les conflits vue qu'on a déjà PostgreSQL installé localement sur 5432.
        options: >-
          --health-cmd "pg_isready -U myuser -d mydb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps: # "steps" définit les étapes à exécuter
      - name: Checkout repository
        uses: actions/checkout@v4 # 1. Récupérer le code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Django tests
        env:
          DATABASE_URL: postgres://myuser:264352@localhost:5433/mydb
        run: |
          cd backend
          python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # 2. Installer Docker Buildx (builder moderne)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Installer Docker Compose (plugin officiel)
      - name: Set up Docker Compose
        uses: docker/setup-docker-action@v3

      # 4. Construire les conteneurs avec docker compose
      - name: Build containers
        run: docker compose -p project-devops build # On ne démarre pas les conteneurs ici, juste la construction — ceci reste une étape de CI, pas de déploiement. Le “run” se fera dans notre futur pipeline deploy.yml.

# "|" sert à indiquer que la commande continue sur plusieurs lignes
